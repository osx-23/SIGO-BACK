spring.application.name=sigo-asistencia-api

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

app.environment=${APP_ENVIRONMENT:development}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# JWT / Spring Security
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:sigo-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}

# Bootstrap de contraseñas SOLO para SIGO-TEST.
# La aplicación aborta el arranque si se activa con APP_ENVIRONMENT=production/prod
# o con el perfil Spring production/prod.
app.test-bootstrap.enabled=${SIGO_TEST_BOOTSTRAP_ENABLED:false}
app.test-bootstrap.operador.codigo=${SIGO_TEST_OPERADOR_CODIGO:2396}
app.test-bootstrap.operador.password=${SIGO_TEST_OPERADOR_PASSWORD:}
app.test-bootstrap.controlador.codigo=${SIGO_TEST_CONTROLADOR_CODIGO:287}
app.test-bootstrap.controlador.password=${SIGO_TEST_CONTROLADOR_PASSWORD:}
app.test-bootstrap.supervisor.codigo=${SIGO_TEST_SUPERVISOR_CODIGO:550}
app.test-bootstrap.supervisor.password=${SIGO_TEST_SUPERVISOR_PASSWORD:}
app.test-bootstrap.password-inicial=${SIGO_TEST_PASSWORD_INICIAL:12345}
