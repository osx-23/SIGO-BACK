name: Package Programacion Backend

on:
  push:
    branches:
      - chatgpt/programacion-distribucion-local
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile backend
        run: mvn -B -DskipTests package

      - name: Build complete ZIP
        run: |
          rm -f SIGO-BACK-PROD-programacion-completo.zip
          zip -r SIGO-BACK-PROD-programacion-completo.zip .             -x ".git/*"             -x "target/*"             -x "SIGO-BACK-PROD-programacion-completo.zip"

      - name: Upload complete backend
        uses: actions/upload-artifact@v4
        with:
          name: sigo-back-programacion-completo
          path: SIGO-BACK-PROD-programacion-completo.zip
          if-no-files-found: error
