name: Backend CI

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Verify programacion architecture
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --include='*.java' -E '^import com\.sigo\..*\.infrastructure\.' src/main/java/com/sigo/programacion/application; then
            echo "programacion/application must not depend on infrastructure"
            exit 1
          fi

          if grep -R --line-number --include='*.java' -E '^import com\.sigo\.programacion\.api\.' src/main/java/com/sigo/programacion/application; then
            echo "programacion/application must not depend on api"
            exit 1
          fi

          if grep -R --line-number --include='*.java' -E '^import (org\.springframework|jakarta\.persistence|com\.sigo\..*\.infrastructure\.|com\.sigo\.programacion\.api\.)' src/main/java/com/sigo/programacion/domain; then
            echo "programacion/domain must remain framework and adapter independent"
            exit 1
          fi

      - name: Verify migrated service boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --include='*.java' -E '^import com\.sigo\..*\.(api|infrastructure)\.' src/main/java/com/sigo/asistencia/application/service; then
            echo "asistencia/application/service must not depend on api or infrastructure"
            exit 1
          fi

          if grep -R --line-number --include='*.java' -E '^import com\.sigo\..*\.(api|infrastructure)\.' src/main/java/com/sigo/relevo/application/service; then
            echo "relevo/application/service must not depend on api or infrastructure"
            exit 1
          fi

          files=(
            src/main/java/com/sigo/inventario/application/service/InventarioCatalogoService.java
            src/main/java/com/sigo/inventario/application/service/InventarioStockService.java
            src/main/java/com/sigo/inventario/application/service/IniciarInventarioService.java
            src/main/java/com/sigo/inventario/application/service/GuardarConteoInventarioService.java
            src/main/java/com/sigo/inventario/application/service/CerrarInventarioService.java
            src/main/java/com/sigo/inventario/application/service/InventarioProductoApplicationService.java
            src/main/java/com/sigo/inventario/application/service/InventarioConsultaService.java
            src/main/java/com/sigo/inventario/application/security/InventarioAuthorizationService.java
            src/main/java/com/sigo/inventario/application/service/InventarioAuditoriaService.java
            src/main/java/com/sigo/personal/application/service/TrabajadorService.java
          )

          for file in "${files[@]}"; do
            if grep -nE '^import com\.sigo\..*\.(api|infrastructure)\.' "$file"; then
              echo "Migrated application service depends on api/infrastructure: $file"
              exit 1
            fi
          done

      - name: Verify migrated api boundaries
        shell: bash
        run: |
          set -euo pipefail

          for dir in asistencia relevo; do
            if grep -R --line-number --include='*.java' -E '^import com\.sigo\.(personal\.infrastructure|security\.application\.service)\.' "src/main/java/com/sigo/$dir/api"; then
              echo "$dir/api must not depend directly on persistence entities or CurrentUserService"
              exit 1
            fi
          done

      - name: Verify security architecture
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --include='*.java' -E '^import com\.sigo\.(personal\.infrastructure|security\.api)\.' src/main/java/com/sigo/security/application; then
            echo "security/application must not depend on personal infrastructure or security api"
            exit 1
          fi

          if grep -R --line-number --include='*.java' -E '^import (org\.springframework|jakarta\.|com\.sigo\..*\.infrastructure\.|com\.sigo\.security\.api\.)' src/main/java/com/sigo/security/domain; then
            echo "security/domain must remain framework and adapter independent"
            exit 1
          fi

      - name: Verify chat architecture
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --include='*.java' -E '^import com\.sigo\.chat\.(api|infrastructure)\.' src/main/java/com/sigo/chat/application; then
            echo "chat/application must not depend on api or infrastructure"
            exit 1
          fi

          if grep -R --line-number --include='*.java' -E '^import org\.springframework\.jdbc\.' src/main/java/com/sigo/chat/application; then
            echo "chat/application must not use JdbcTemplate"
            exit 1
          fi

          if grep -R --line-number --include='*.java' -E '^import (org\.springframework|jakarta\.|com\.sigo\..*\.infrastructure\.|com\.sigo\.chat\.api\.)' src/main/java/com/sigo/chat/domain; then
            echo "chat/domain must remain framework and adapter independent"
            exit 1
          fi
